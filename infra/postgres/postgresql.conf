# AI Pulse PostgreSQL configuration (sized for a 2 GB container; adjust with the container's memory).
listen_addresses = '*'
port = 5432
max_connections = 100                 # api (pool 10+10/replica) + workers (NullPool) + exporters + admin
password_encryption = scram-sha-256

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB          # also used when building HNSW indexes
max_parallel_maintenance_workers = 2
random_page_cost = 1.1                # SSD storage
effective_io_concurrency = 200

wal_level = replica                   # allows physical backups / replicas later
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Observability
log_destination = 'stderr'
logging_collector = off               # stderr goes to the container log driver
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms    # slow queries
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_connections = off
log_disconnections = off
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on

# Safety
idle_in_transaction_session_timeout = 5min
statement_timeout = 0                 # set per role/transaction where needed (migrations can be long)
timezone = 'UTC'
