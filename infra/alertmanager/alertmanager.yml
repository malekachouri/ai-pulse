# Routes every alert to one webhook (Slack/Teams/Discord-compatible incoming webhook, or any HTTP endpoint).
# The URL is read from the Docker secret secrets/alert_webhook_url so it never lands in the repository.
route:
  receiver: webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: webhook
      repeat_interval: 1h

receivers:
  - name: webhook
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true

inhibit_rules:
  - source_matchers: [alertname="APIDown"]
    target_matchers: [alertname=~"HighErrorRate|HighLatencyP95"]
