# AI Pulse Redis configuration
bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# Persistence: the broker queue and rate-limit counters survive restarts.
appendonly yes
appendfsync everysec
save 900 1 300 10

# Celery needs every message: never evict keys. Size the container accordingly.
maxmemory 256mb
maxmemory-policy noeviction

# Commands nobody needs in production.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command KEYS ""

timeout 0
tcp-keepalive 60
loglevel notice
