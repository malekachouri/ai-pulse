[project]
name = "ai-pulse-backend"
version = "0.1.0"
description = "AI Pulse - AI & Technology Intelligence Platform (API)"
requires-python = ">=3.15"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"alembic/*" = ["E501"]
# prompt text, regexes and curated lexicons/catalogs read better unwrapped
"app/ai/prompts.py" = ["E501"]
"app/ai/text.py" = ["E501"]
"app/ai/learning.py" = ["E501"]
"app/alerts/engine.py" = ["E501"]  # rule table in the docstring
"app/services/radar.py" = ["E501"]  # raw SQL

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
