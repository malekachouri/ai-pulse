version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint (used by eslint-config-next) rejects TypeScript 7.0; lift this once it supports it:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday }
    groups:
      e2e: { patterns: ["*"] } # Playwright and axe-core move together; CI installs the matching browser
  - package-ecosystem: docker
    directories: [/backend, /frontend, /infra/postgres, /infra/redis]
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
